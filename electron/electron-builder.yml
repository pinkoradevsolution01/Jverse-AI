appId: ai.jverse.desktop
productName: JVerse AI
protocols:
  - name: JVerse Secure Sign In
    schemes:
      - jverse
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true
extraResources:
  - from: ../services/brain
    to: brain
    filter:
      - app/**
      - pyproject.toml
electronUpdaterCompatibility: ">= 2.16"
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  hardenedRuntime: true
linux:
  target:
    - AppImage
