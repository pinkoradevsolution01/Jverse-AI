[project]
name = "jverse-brain"
version = "0.1.0"
description = "JVerse trusted Python agent brain"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "langgraph>=0.2,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "faster-whisper>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "piper-tts>=1.8,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

